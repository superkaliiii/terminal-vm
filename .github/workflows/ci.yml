name: CI
on:
  push:
    branches: [main, mac-host-control, unified]
  pull_request:
permissions:
  contents: read
jobs:
  terminal-vm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only)
        working-directory: terminal-vm
        run: python -m unittest -v
  packages:
    # the PyPI and npm packages: built, installed apart, run (published only at a release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal-vm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: PyPI package
        run: |
          python -m pip install -q build
          python -m build --outdir "$RUNNER_TEMP/dist" .
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q "$RUNNER_TEMP"/dist/*.whl
          "$RUNNER_TEMP/venv/bin/terminal-vm" version
          test -f "$("$RUNNER_TEMP/venv/bin/terminal-vm" skills path)"
      - name: npm package
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          npm install -g --prefix "$RUNNER_TEMP/npm" "$RUNNER_TEMP"/terminal-vm-*.tgz
          "$RUNNER_TEMP/npm/bin/terminal-vm" version
          test -f "$("$RUNNER_TEMP/npm/bin/terminal-vm" skills path)"
      - name: Install script
        run: |
          sh install.sh --no-deps --no-mcp --prefix "$RUNNER_TEMP/sh"
          "$RUNNER_TEMP/sh/bin/terminal-vm" version
          sh install.sh --uninstall --no-mcp --prefix "$RUNNER_TEMP/sh"
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build (ad-hoc signed)
        run: SIGN_IDENTITY=- bash scripts/build.sh
      - name: Package checks
        run: |
          VERSION=0.0.0 BUILD_NUMBER=1 GITHUB_REPO= bash scripts/release.sh --local
          bash scripts/test-package.sh "$PWD/dist/releases/terminal-mac-0.0.0-1-macos-arm64-local.zip"
      - name: Plugin manifest
        run: python3 -c "import json; [json.load(open(f)) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"

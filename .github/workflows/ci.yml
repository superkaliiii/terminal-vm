name: CI
on:
  push:
    branches: [main, mac-host-control, unified]
  pull_request:
permissions:
  contents: read
jobs:
  terminal-vm:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (stdlib only)
        working-directory: terminal-vm
        run: python -m unittest -v
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Test
        run: swift test
      - name: Build (ad-hoc signed)
        run: SIGN_IDENTITY=- bash scripts/build.sh
      - name: Package checks
        run: |
          VERSION=0.0.0 BUILD_NUMBER=1 GITHUB_REPO= bash scripts/release.sh --local
          bash scripts/test-package.sh "$PWD/dist/releases/terminal-mac-0.0.0-1-macos-arm64-local.zip"
      - name: Plugin manifest
        run: python3 -c "import json; [json.load(open(f)) for f in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json')]"
